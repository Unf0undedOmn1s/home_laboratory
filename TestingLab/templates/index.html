<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Password Vault</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div>
                <h1>Orion Password Management System</h1>
                <h2 class="subtitle">Home Lab composed of: Orion (Ideapad 3) and Andromeda (Dell Optiplex)</h2>
            </div>
            <div class="header-actions">
                <span class="user-info">Logged in as: 'admin'</span>
                <a href="/logout" class="btn-secondary">Logout</a>
            </div>
        </header>

        <main class="main-content">
            <div class="toolbar">
                <button id="addPasswordBtn" class="btn-primary">+ Add Password</button>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search passwords...">
                </div>
            </div>

            <div class="passwords-grid" id="passwordsGrid">
                <div class="no-passwords">No passwords stored yet. Click "Add Password" to get started.</div>
            </div>
        </main>
    </div>

    <!-- Add Password Modal -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Password</h3>
                <span class="close">&times;</span>
            </div>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="name">Service Name *</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="url">URL</label>
                    <input type="url" id="url">
                </div>
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-primary">Save Password</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>

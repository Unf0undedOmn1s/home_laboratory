{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4>Password Details - {{ service_name }}</h4>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label"><strong>Service/Website:</strong></label>
                    <p>{{ service_name }}</p>
                </div>
                <div class="mb-3">
                    <label class="form-label"><strong>Username/Email:</strong></label>
                    <p>{{ username }}</p>
                </div>
                <div class="mb-3">
                    <label class="form-label"><strong>Password:</strong></label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="passwordField" value="{{ password }}" readonly>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">Show</button>
                    </div>
                </div>
                {% if notes %}
                <div class="mb-3">
                    <label class="form-label"><strong>Notes:</strong></label>
                    <p>{{ notes }}</p>
                </div>
                {% endif %}
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    const passwordField = document.getElementById('passwordField');
    const button = event.target;
    
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        button.textContent = 'Hide';
    } else {
        passwordField.type = 'password';
        button.textContent = 'Show';
    }
}
</script>
{% endblock %}
